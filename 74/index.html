<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>映画鑑賞記録アプリ</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="index_script.js"></script>
</head>
<body>

  <header>
    <h1>🎬 映画鑑賞記録</h1>
  </header>

  <main class="form-container">
    <h2>映画を登録</h2>

    <div class="form-group">
      <label>映画タイトル</label>
      <input type="text" id="title" placeholder="映画のタイトル">
    </div>

    <div class="form-group">
      <label>観た日</label>
      <input type="date" id="date">
    </div>

    <div class="button-area">
      <button onclick="saveMovie()">登録する</button>
    </div>
  </main>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>映画鑑賞記録アプリ</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="home_script.js" type="text/javascript" charset="utf-8"></script>
</head>
</head>
<body>

  <header>
    <h1>🎬 映画鑑賞記録</h1>
  </header>
    <div class="container">
        <div class="card" onclick="goRecord()">
            <div class="text"><h2>🎬記録する</h2></div>
        </div>

        <div class="card" onclick="goHistory()">
            <div class="text"><h2>📖記録を見る</h2></div>
        </div>
    </div>
  

  <script src="home.js"></script>
</body>
</html>
